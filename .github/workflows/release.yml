name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag as semver and extract release info
        id: info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "Tag '$TAG' is not a valid semver tag (expected vX.Y.Z or vX.Y.Z-prerelease.N)" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from the annotated tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}" > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/MapExplorer.App -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o publish/linux-x64

      - name: Build AppImage + deb
        run: |
          mkdir -p release-assets
          bash packaging/linux/build-appimage.sh publish/linux-x64 release-assets ${{ needs.prepare.outputs.version }}
          bash packaging/linux/build-deb.sh publish/linux-x64 release-assets ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets/*

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained win-x64
        run: |
          dotnet publish src/MapExplorer.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true `
            -p:Version=${{ needs.prepare.outputs.version }} `
            -o publish/win-x64

      - name: Package portable zip
        # Portable-only for v1 — no installer (WiX vs Velopack decision deferred).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "release-assets/minecraft-map-${{ needs.prepare.outputs.version }}-win-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/*

  publish:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          cp artifacts/linux-artifacts/* upload/
          cp artifacts/windows-artifacts/* upload/
          cp artifacts/release-notes/notes.md notes.md

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload artifacts to Google Cloud Storage
        run: |
          gsutil -m cp upload/* "gs://${{ vars.GCS_BUCKET }}/minecraft-map/${{ needs.prepare.outputs.tag }}/"

      - name: Build release notes with download links
        run: |
          {
            if [ -s notes.md ]; then
              cat notes.md
              echo
              echo
            fi
            echo "## Downloads"
            echo
            for f in upload/*; do
              name="$(basename "$f")"
              encoded="$(jq -rn --arg s "$name" '$s | @uri')"
              echo "- [$name](https://storage.googleapis.com/${{ vars.GCS_BUCKET }}/minecraft-map/${{ needs.prepare.outputs.tag }}/$encoded)"
            done
          } > release_body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file release_body.md \
            $PRERELEASE_FLAG
